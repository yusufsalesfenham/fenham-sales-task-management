/* V2.2.1 responsive header correction: override legacy sidebar width and grid rules */
html,body,#app{width:100%;max-width:100%;min-width:0}
html{overflow-x:hidden}body{overflow-x:hidden}
.app-shell{display:flex!important;flex-direction:column!important;grid-template-columns:none!important;width:100%;min-width:0}
.app-shell>.sidebar{position:sticky;top:0;z-index:30;display:flex;flex-direction:row;align-items:center;gap:18px;box-sizing:border-box;width:100%!important;max-width:100%!important;min-width:0!important;height:auto!important;min-height:78px!important;padding:11px clamp(14px,2.6vw,38px)!important;margin:0!important;flex:0 0 auto!important}
.app-shell>.sidebar>.brand-area{flex:0 0 auto;min-width:0}
.app-shell>.sidebar>.top-nav-links{display:flex;flex:1 1 auto;min-width:0;flex-wrap:nowrap;gap:4px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#bbb transparent}
.app-shell>.sidebar>.top-nav-links .nav{flex:0 0 auto;white-space:nowrap}
.app-shell>.sidebar>.sidebar-bottom{display:flex;align-items:center;gap:9px;margin:0 0 0 auto;min-width:0;flex:0 0 auto}
.app-shell>.main{box-sizing:border-box;width:100%;max-width:1500px;min-width:0;margin:0 auto}
.profile-trigger{background:#f8f8f8;border:1px solid #e4e4e4;border-radius:9px;padding:8px 11px;display:flex;gap:9px;align-items:center;text-align:left;cursor:pointer;max-width:210px;color:#333}
.profile-trigger:hover,.profile-trigger[aria-expanded="true"]{border-color:#333;background:#f2f2f2}
.profile-dot{height:9px;width:9px;border-radius:50%;background:#333;flex:0 0 9px}
.profile-trigger .account-copy{min-width:0;display:block;font-size:10px;line-height:1.35;color:#666}
.profile-trigger .account-copy b{display:block;font-size:12px;color:#171717;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-popover{position:absolute;right:24px;top:calc(100% + 7px);width:min(340px,calc(100vw - 30px));border:1px solid #e6e6e6;border-radius:13px;background:#fff;padding:20px;box-shadow:0 16px 45px #0002;z-index:60}
.account-popover h3{font-size:15px;margin:0 0 13px}
.account-detail{border-bottom:1px solid #eee;padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:12px}
.account-detail span:first-child{color:#7a7a7a}.account-detail strong{text-align:right;font-size:12px}
.account-popover .account-tip{font-size:11px;color:#777;margin:13px 0 0;line-height:1.5}
.confirmed-shift{border:1px solid #ddd;border-radius:10px;padding:12px 15px;background:#f7f7f7;margin:12px 0 20px;font-size:12px}
.confirmed-shift strong{display:block;margin-bottom:5px}.confirmed-shift small{display:block;color:#737373;line-height:1.6}
.shift-option{cursor:pointer}.shift-login-card .shift-option:focus-visible{outline:3px solid #666;outline-offset:2px}

}

 .profile-trigger{max-width:160px;padding:6px 8px}

 .app-shell>.main{padding:23px 14px 44px!important}
 .metrics{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px}
 .metric{padding:15px 12px}.metric .value{font-size:25px}
 .pagehead h1{font-size:26px}

 .formgrid .full{grid-column:1}

}

 .login-card h1{font-size:27px}
}

function applies(t,u,d){if(!t.assignees.includes(u)||!(t.repeat==='Harian'||t.date===d))return false;if(u==='supervisor')return t.group==='supervisor';const shift=getShift(u,d);if(!shift)return false;return t.group==='team'&&MAP[shift]?.includes(t.period)}

for(const seg of SEG){const rows=visible.filter(t=>t.period===seg);if(!rows.length)continue;h+=`<div class="session-label">${seg}</div><div class="task-list">${rows.map(t=>`<div class="task-item ${view.completed?'finished':''}"><label class="check-action"><input type="checkbox" data-check="${t.id}" ${view.completed?'checked':''} aria-label="Selesaikan ${safe(t.title)}"></label><div style="flex:1"><div class="taskname">${safe(t.title)}</div><div class="subcell">${safe(t.category||'Operasional')} · ${t.deadline?'Deadline '+safe(t.deadline):'Tanpa deadline'}</div></div>${view.completed?badge('✓ Selesai','green'):badge('Belum selesai','amber')}</div>`).join('')}</div>`}
if(!visible.length)h+='<div class="empty">Tidak ada tugas di daftar ini.</div>';h+='</div>';return h}
function report(){const a=assignments(),completed=a.filter(t=>t.done).length,late=a.filter(t=>warning(t)==='late').length;let h=head('Evaluasi & Riwayat','Rekap tugas berdasarkan akun, tanggal, dan shift yang dikonfirmasi.','<button class="btn" data-action="export">↓ Export CSV</button>')+filters();h+=`<div class="metrics">${metric('Penugasan',a.length,'Aktif pada periode','gold')}${metric('Selesai',completed,'Checklist tercatat','green')}${metric('Belum selesai',a.length-completed,'Perlu ditindaklanjuti','red')}${metric('Terlambat',late,'Lewat deadline','red')}</div><div class="team-cards">${USERS.map(profileCard).join('')}</div><section class="panel"><h2>Riwayat tugas</h2><p class="desc">Hanya tugas yang berlaku berdasarkan shift masing-masing tanggal.</p><div class="table-scroller"><table class="data-table"><thead><tr><th>Tanggal</th><th>Akun</th><th>Shift</th><th>Tugas</th><th>Sesi</th><th>Status</th></tr></thead><tbody>${a.slice(0,450).map(x=>`<tr><td>${x.d}</td><td>${safe(un(x.u))}</td><td>${safe(x.u==='supervisor'?'—':getShift(x.u,x.d))}</td><td>${safe(x.t.title)}</td><td>${x.t.period}</td><td>${x.done?badge('✓ Selesai','green'):warning(x)==='late'?badge('⚠ Terlambat','red'):badge('Belum selesai','amber')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Belum ada tugas dalam periode ini.</td></tr>'}</tbody></table></div></section>`;return h}
function modal(){const t=data.tasks.find(t=>t.id===view.edit),g=t?.group||view.group,own=g==='supervisor';return `<div class="modal-overlay"><form class="modal" id="task-form"><div class="modalhead"><h2>${t?'Edit':'Tambah'} ${own?'Tugas Supervisor':'Tugas Tim'}</h2><button type="button" class="btn btn-plain" data-action="close">✕</button></div><div class="formgrid"><div class="full"><label class="label">Nama tugas</label><input class="field" name="title" required maxlength="180" value="${safe(t?.title||'')}"></div><div><label class="label">Kelompok waktu</label><select name="period" class="field">${SEG.map(p=>`<option ${t?.period===p?'selected':''}>${p}</option>`).join('')}</select></div><div><label class="label">Deadline opsional</label><input type="time" name="deadline" class="field" value="${safe(t?.deadline||'')}"></div><div><label class="label">Pengulangan</label><select name="repeat" class="field" id="repeat"><option ${t?.repeat!=='Sekali'?'selected':''}>Harian</option><option ${t?.repeat==='Sekali'?'selected':''}>Sekali</option></select></div><div><label class="label">Tanggal jika sekali</label><input type="date" id="once-date" name="date" class="field" value="${safe(t?.date||view.dateFrom)}"></div><div class="full"><label class="label">Kategori</label><input name="category" class="field" value="${safe(t?.category||(own?'Monitoring & Controlling':'Operasional Tim'))}"></div>${own?'':`<div class="full"><label class="label">Ditugaskan ke akun</label><div class="checkgrid">${USERS.filter(u=>u.id!=='supervisor').map(u=>`<label><input type="checkbox" name="assignees" value="${u.id}" ${t?.assignees.includes(u.id)?'checked':''}>${safe(u.name)}</label>`).join('')}</div><p class="quiet-note">Kelompok waktu Pagi/Siang/Malam akan diaktifkan berdasarkan shift tiap akun.</p></div>`}<div class="full"><label class="label">Catatan</label><textarea class="field" name="notes" rows="2">${safe(t?.notes||'')}</textarea></div></div><div class="modal-foot"><button type="button" class="btn" data-action="close">Batal</button><button class="btn btn-primary" type="submit">Simpan tugas</button></div></form></div>`}
function draw(){if(!view.uid){login();return}let page=admin()?({overview,own:()=>taskListPage('supervisor'),teamtasks:()=>taskListPage('team'),shifts:shiftPage,mine:myTasks,report,notes:notesPage,notices:notificationsPage}[view.page]||overview):({mine:myTasks,history:myTasks,notes:notesPage,notices:notificationsPage}[view.page]||myTasks);app.innerHTML=`<div class="app-shell">${nav()}<main class="main">${page()}<div class="footer-line">FENHAM | SALES TASK MANAGEMENT • DEMO V2.2.1 • DATA LOKAL BROWSER</div></main></div>${view.modal?modal():''}${view.noteModal?noteModal():''}${noticePop(view.noticePopup)}`;if(view.modal)$('#once-date').disabled=$('#repeat').value!=='Sekali'}
function toast(msg){document.querySelector('.toast')?.remove();let p=document.createElement('div');p.className='toast';p.textContent=msg;document.body.appendChild(p);setTimeout(()=>p.remove(),2400)}
function setShift(u,d,s){if(!USERS.some(x=>x.id===u&&x.id!=='supervisor')||!SHIFT.includes(s))return;if(!admin()&&!(view.uid===null&&u===view.pendingUid&&d===TODAY&&!getShift(u,d))){toast('Shift terkunci. Hubungi Supervisor.');return}const before=getShift(u,d);if(before===s){toast('Shift tidak berubah');return}data.shifts[shiftKey(u,d)]={shift:s,setAt:Date.now(),setBy:view.uid||u};data.history.push({kind:'shift',user:u,date:d,shift:s,previous:before,at:Date.now(),by:view.uid||u});if(before){const removed=data.tasks.filter(t=>t.group==='team'&&t.assignees.includes(u)&&(t.repeat==='Harian'||t.date===d)&&MAP[before].includes(t.period)&&!MAP[s].includes(t.period));const gained=data.tasks.filter(t=>t.group==='team'&&t.assignees.includes(u)&&(t.repeat==='Harian'||t.date===d)&&!MAP[before].includes(t.period)&&MAP[s].includes(t.period));let message=`${un(u)}: ${before} → ${s} pada ${labelDate(d)}. ${removed.length} tugas menjadi tidak aktif, ${gained.length} tugas aktif.`;sendNotice(['supervisor',u],'Perubahan shift',message,'warning');view.noticePopup={title:'Perubahan shift berdampak pada tugas',message};}else{sendNotice(['supervisor',u],'Shift dikonfirmasi',`${un(u)} memilih ${s} untuk ${labelDate(d)}.`,'info')}save();draw();toast('Shift '+un(u)+' ditetapkan: '+s)}
app.addEventListener('click',e=>{const loginShift=e.target.closest('[data-login-shift]');if(loginShift){const u=$('#login-account')?.value;if(u&&!getShift(u,TODAY)){view.pendingUid=u;setShift(u,TODAY,loginShift.dataset.loginShift);view.uid=u;view.pendingUid=null;view.page='mine';view.dateFrom=TODAY;view.dateTo=TODAY;view.completed=false;view.accountOpen=false;draw();toast('Shift dikonfirmasi. Selamat bekerja!')}return}const scope=e.target.closest('[data-notes-scope]');if(scope){view.notesScope=scope.dataset.notesScope;draw();return}const editNote=e.target.closest('[data-edit-note]');if(editNote){const n=data.notes.find(n=>n.id===editNote.dataset.editNote);if(n?.owner===view.uid){view.noteEdit=n.id;view.noteModal=true;draw()}return}const delNote=e.target.closest('[data-delete-note]');if(delNote){const n=data.notes.find(n=>n.id===delNote.dataset.deleteNote);if(n?.owner===view.uid&&confirm('Hapus catatan ini?')){data.notes=data.notes.filter(x=>x.id!==n.id);save();draw()}return}const readNote=e.target.closest('[data-read-note]');if(readNote){const n=data.notifications.find(n=>n.id===readNote.dataset.readNote&&n.user===view.uid);if(n){n.read=true;save();draw()}return}const nav=e.target.closest('[data-page]');if(nav){view.page=nav.dataset.page;view.search='';view.period='all';view.person='all';view.completed=view.page==='history';view.shiftOpen=false;view.accountOpen=false;draw();return}if(e.target.closest('#logout')){view.uid=null;view.page='overview';view.pendingUid=null;view.noticePopup=null;view.accountOpen=false;draw();return}const b=e.target.closest('[data-set-shift]');if(b){if(!admin()&&b.dataset.setShift!==view.uid)return;setShift(b.dataset.setShift,b.dataset.shiftDate,b.dataset.shift);return}const create=e.target.closest('[data-create]');if(create&&admin()){view.group=create.dataset.create;view.edit=null;view.modal=true;draw();return}const edit=e.target.closest('[data-edit]');if(edit&&admin()){view.edit=edit.dataset.edit;view.group=data.tasks.find(t=>t.id===view.edit)?.group||'team';view.modal=true;draw();return}const del=e.target.closest('[data-delete]');if(del&&admin()){const t=data.tasks.find(x=>x.id===del.dataset.delete);if(t&&confirm('Hapus tugas "'+t.title+'"?')){data.tasks=data.tasks.filter(x=>x.id!==t.id);sendNotice([...t.assignees,'supervisor'],'Tugas dihapus',`Tugas ${t.title} telah dihapus oleh Supervisor.`);save();draw();toast('Tugas dihapus')}return}const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;if(a==='account'){view.accountOpen=!view.accountOpen;draw();return}else if(a==='note-new'){view.noteEdit=null;view.noteModal=true;draw()}else if(a==='note-close'){view.noteModal=false;draw()}else if(a==='all-read'){data.notifications.filter(n=>n.user===view.uid).forEach(n=>n.read=true);save();draw()}else if(a==='dismiss-notice'){if(view.noticePopup?.id){const n=data.notifications.find(n=>n.id===view.noticePopup.id);if(n)n.read=true;save()}view.noticePopup=null;draw()}else if(a==='today'){view.dateFrom=TODAY;view.dateTo=TODAY;draw()}else if(a==='week'){const d=new Date();d.setDate(d.getDate()-6);view.dateFrom=dateKey(d);view.dateTo=TODAY;draw()}else if(a==='close'){view.modal=false;draw()}else if(a==='active'||a==='completed'){view.completed=a==='completed';draw()}else if(a==='toggle-shift'){view.shiftOpen=!view.shiftOpen;draw()}else if(a==='export'&&admin()){const rows=[['Tanggal','Akun','Shift','Kelompok','Tugas','Status','Selesai pada'],...assignments().map(x=>[x.d,un(x.u),getShift(x.u,x.d),x.t.period,x.t.title,x.done?'Selesai':warning(x)==='late'?'Terlambat':'Belum selesai',x.time?new Date(x.time).toLocaleString('id-ID'):''])];const csv=rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const l=document.createElement('a');l.href=url;l.download='Fenham_Laporan_'+view.dateFrom+'_sd_'+view.dateTo+'.csv';l.click();setTimeout(()=>URL.revokeObjectURL(url),800)}});
app.addEventListener('change',e=>{const id=e.target.id;if(id==='from'||id==='to'){const a=$('#from')?.value||TODAY,b=$('#to')?.value||TODAY;if(a>b){toast('Tanggal mulai tidak boleh melewati tanggal akhir');draw();return}view.dateFrom=a;view.dateTo=b;draw();return}if(id==='mine-date'||id==='shift-date'){view.dateFrom=e.target.value;view.dateTo=e.target.value;draw();return}if(id==='period'){view.period=e.target.value;draw();return}if(id==='person'){view.person=e.target.value;draw();return}if(id==='repeat'){const node=$('#once-date');if(node)node.disabled=e.target.value!=='Sekali';return}if(e.target.matches('[data-shift-select]')){if(!admin()){toast('Hanya Supervisor yang boleh mengubah shift');draw();return}setShift(e.target.dataset.shiftSelect,view.dateFrom,e.target.value);return}if(e.target.matches('[data-check]')){let t=data.tasks.find(x=>x.id===e.target.dataset.check),u=view.uid,d=view.dateFrom;if(!t||!applies(t,u,d)){toast('Tugas tidak aktif untuk akun dan tanggal ini');draw();return}const key=ck(t,u,d);if(e.target.checked)data.completions[key]=Date.now();else delete data.completions[key];data.history.push({kind:'check',taskId:t.id,user:u,date:d,checked:e.target.checked,at:Date.now()});save();draw();toast(e.target.checked?'Tugas selesai ✓':'Checklist dibatalkan');return}});
app.addEventListener('input',e=>{if(e.target.id==='search'){view.search=e.target.value;const pos=e.target.selectionStart;draw();let node=$('#search');node?.focus();node?.setSelectionRange(pos,pos)}});
app.addEventListener('submit',e=>{if(e.target.id==='note-form'){e.preventDefault();const f=new FormData(e.target),title=String(f.get('title')||'').trim(),body=String(f.get('body')||'').trim(),scope=String(f.get('scope')||'personal');if(!title||!body)return;const old=data.notes.find(x=>x.id===view.noteEdit);if(old&&old.owner!==view.uid)return;let n={id:old?.id||uid(),owner:view.uid,title,body,scope:scope==='shared'?'shared':'personal',createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()};if(old)data.notes=data.notes.map(x=>x.id===old.id?n:x);else data.notes.unshift(n);if(scope==='shared')sendNotice(USERS.map(u=>u.id).filter(x=>x!==view.uid),'Catatan bersama diperbarui',`${un(view.uid)} menyimpan catatan: ${title}`);save();view.noteModal=false;draw();toast('Catatan tersimpan');return}if(e.target.id!=='task-form'||!admin())return;e.preventDefault();const f=new FormData(e.target),title=String(f.get('title')||'').trim(),own=view.group==='supervisor',assignees=own?['supervisor']:f.getAll('assignees');if(!title||!assignees.length){toast('Nama tugas dan akun wajib diisi');return}let prev=data.tasks.find(t=>t.id===view.edit);const t={id:prev?.id||uid(),title,group:view.group,period:f.get('period'),category:f.get('category')||'Operasional',deadline:f.get('deadline')||'',repeat:f.get('repeat'),date:f.get('repeat')==='Sekali'?f.get('date'):TODAY,notes:f.get('notes')||'',assignees};if(prev)data.tasks=data.tasks.map(x=>x.id===prev.id?t:x);else data.tasks.push(t);if(!own){const impacted=[...new Set([...(prev?.assignees||[]),...assignees])];let off=[];for(const u of assignees){const sh=getShift(u,t.repeat==='Sekali'?t.date:TODAY);if(sh&&!MAP[sh].includes(t.period))off.push(`${un(u)} (${sh})`)}let msg=`${prev?'Perubahan':'Penugasan baru'}: ${title} [${t.period}]. ${off.length?'Tidak aktif pada shift: '+off.join(', ')+'.':'Silakan cek daftar tugas.'}`;sendNotice([...impacted,'supervisor'],off.length?'⚠ Tugas tidak sesuai shift':prev?'Tugas diperbarui':'Tugas baru ditambahkan',msg,off.length?'warning':'info');if(off.length)view.noticePopup={title:'Ketidaksesuaian penugasan',message:msg}}data.history.push({kind:prev?'edit':'create',taskId:t.id,by:view.uid,at:Date.now()});save();view.modal=false;draw();toast(prev?'Perubahan tersimpan':'Tugas ditambahkan')});
login();})();</script></body></html>
