const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayLabel=s=>new Date(s+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const uid=()=> 't_'+Math.random().toString(36).slice(2,11);
const init=()=>({tasks:[...SEED_SUP.map((a,i)=>({id:'sup_'+i,title:a[0],session:a[1],category:a[2],deadline:a[3],assignees:[SUP.id],repeat:'Harian',date:dateKey(),notes:'',createdAt:Date.now()})),
 ...[
 ['SIMULASI — Review chat masuk','Shift 1','sales1','10:00'],
 ['SIMULASI — Review follow-up','Shift 2','sales2','15:00'],
 ['SIMULASI — Monitoring percakapan','Shift Split 1/3','cs1','16:00'],
 ['SIMULASI — Rekap chat pelanggan','Shift Split 1/3','cs2','19:00']
 ].map((a,i)=>({id:'demo_team_'+i,title:a[0],session:a[1],category:'Monitoring & Controlling',deadline:a[3],assignees:[a[2]],repeat:'Harian',date:dateKey(),notes:'Data simulasi, diganti setelah distribusi tugas final.',createdAt:Date.now()}))],completions:{},history:[]});
let data;try{data=JSON.parse(localStorage.getItem(STORAGE))||init();if(!Array.isArray(data.tasks)||!data.completions)throw Error('broken')}catch{data=init()}
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch{}};
const today=dateKey();
let session={role:null,userId:null,page:'overview',dateFrom:today,dateTo:today,filterUser:'all',filterSession:'all',search:'',showCompleted:false,modal:false,editId:null};
const app=document.getElementById('app');
const userName=id=>USERS.find(u=>u.id===id)?.name||id;
const isSupervisorTask=t=>t.assignees.includes('supervisor');
const isForDate=(t,date)=>t.repeat==='Harian'||t.date===date;
const daysInRange=()=>{let a=session.dateFrom,b=session.dateTo;if(!a||!b||a>b)return [];let start=new Date(a+'T12:00:00'),end=new Date(b+'T12:00:00'),out=[];for(let i=0;start<=end&&i<93;i++,start.setDate(start.getDate()+1))out.push(dateKey(start));return out};
const completionKey=(t,u,date)=>`${t.repeat==='Sekali'?'once':date}|${u}|${t.id}`;
const completedAt=(t,u,date)=>data.completions[completionKey(t,u,date)];
const isDone=(t,u,date)=>Boolean(completedAt(t,u,date));
const assignments=(dates=daysInRange())=>dates.flatMap(date=>data.tasks.filter(t=>isForDate(t,date)).flatMap(t=>t.assignees.map(userId=>({t,userId,date,done:isDone(t,userId,date),time:completedAt(t,userId,date)}))));
const percent=(a,b)=>b?Math.round(a/b*100):0;
const incompleteStatus=(a)=>{if(a.done)return'complete';if(a.date<today)return'overdue';if(a.date>today)return'pending';if(a.t.deadline&&a.t.deadline<new Date().toTimeString().slice(0,5))return'overdue';return'pending'};
const userStats=(userId)=>{const items=assignments().filter(a=>a.userId===userId),done=items.filter(a=>a.done).length,overdue=items.filter(a=>incompleteStatus(a)==='overdue').length;return {total:items.length,done,pending:items.length-done,overdue,pct:percent(done,items.length),name:userName(userId),id:userId}};
const totals=()=>{const a=assignments();return {total:a.length,done:a.filter(x=>x.done).length,pending:a.filter(x=>!x.done).length,overdue:a.filter(x=>incompleteStatus(x)==='overdue').length,pct:percent(a.filter(x=>x.done).length,a.length)}};
const note=(t)=>t.notes?`<div class="subcell">${safe(t.notes)}</div>`:'';
const badgeStatus=(a)=>a.done?'<span class="badge green">✓ Selesai</span>':incompleteStatus(a)==='overdue'?'<span class="badge red">⚠ Terlambat</span>':'<span class="badge amber">Belum selesai</span>';
const metric=(label,val,detail,style='')=>`<div class="metric ${style}"><h3>${safe(label)}</h3><div class="value">${safe(val)}</div><div class="detail">${safe(detail)}</div></div>`;
const head=(title,desc,actions='')=>`<div class="pagehead"><div><div class="eyebrow">FENHAM / SALES TASK MANAGEMENT</div><h1>${safe(title)}</h1><div class="subtitle">${safe(desc)}</div></div><div class="actions">${actions}</div></div>`;
const dateFilters=()=>`<div class="admin-datebar"><div class="filter"><label>Mulai tanggal</label><input type="date" id="range-from" value="${safe(session.dateFrom)}"></div><div class="filter"><label>Sampai tanggal</label><input type="date" id="range-to" value="${safe(session.dateTo)}"></div><button class="btn btn-sm" data-action="today">Hari ini</button><button class="btn btn-sm" data-action="week">7 hari</button><span class="tiny-note">Laporan mencakup tanggal terpilih (maks. 93 hari).</span></div>`;
const progress=(p)=>`<div class="track"><div class="fill ${p>=75?'green':p<=25?'red':'amber'}" style="width:${p}%"></div></div>`;
function login(){app.innerHTML=`<div class="login-screen"><div class="login-visual"><div class="brandmark"><img src="${LOGO}" alt="Fenham"></div><div><div class="brand-caption">OPERATIONS WORKSPACE</div><div class="serif">Better clarity.<br><em>Every shift.</em></div><p>Supervisor mengatur tugas. Tim menjalankan checklist berdasarkan shift. Semua progress terbaca dalam satu dashboard.</p></div><div class="brand-caption">FENHAM | SALES TASK MANAGEMENT</div></div><div class="login-form-area"><div class="login-card"><div class="eyebrow">WELCOME BACK</div><h1>Masuk ke workspace</h1><p>Pilih akun simulasi untuk menguji Supervisor atau anggota tim.</p><div class="form-row"><label class="label">Akun demo</label><select id="login-as" class="field"><option value="supervisor">Supervisor — Admin Control</option>${USERS.filter(u=>u.id!=='supervisor').map(u=>`<option value="${u.id}">${safe(u.name)} — Checklist Only</option>`).join('')}</select></div><button class="btn btn-primary btn-block" id="sign-in">Masuk ke Dashboard ↗</button><div class="login-note"><b>Demo lokal.</b> Akun dan data tersimpan di browser ini. Belum ada login atau database online sungguhan.</div></div></div></div>`;document.querySelector('#sign-in').onclick=()=>{const value=document.querySelector('#login-as').value;session.role=value==='supervisor'?'admin':'staff';session.userId=value;session.page=session.role==='admin'?'overview':'mytasks';session.dateFrom=today;session.dateTo=today;draw()}}
function nav(){const n=session.role==='admin'?[['overview','▦','Overview Per Akun'],['tasks','☷','Manajemen Tugas'],['team','♙','Akun Tim'],['report','▤','Evaluasi & Riwayat']]:[['mytasks','☑','Tugas Saya'],['history','◷','Tugas Selesai']];return `<aside class="sidebar"><div class="brand-area"><img src="${LOGO}" alt="Fenham"><small>Sales Task Management</small></div><div class="section-label">WORKSPACE</div>${n.map(([page,icon,label])=>`<button class="nav ${session.page===page?'active':''}" data-page="${page}"><span style="min-width:18px">${icon}</span>${label}</button>`).join('')}<div class="sidebar-bottom"><div class="account"><div class="avatar">${session.role==='admin'?'SP':safe(userName(session.userId).split(' ').map(x=>x[0]).join(''))}</div><div><div class="account-name">${session.role==='admin'?'Supervisor':safe(userName(session.userId))}</div><div class="account-role">${session.role==='admin'?'Full control':'Checklist only'}</div></div></div><button class="btn btn-sm" style="margin-top:20px;width:100%" id="logout">Keluar dari demo</button></div></aside>`}
function teamCard(user){const p=userStats(user.id),warn=p.pending>0;return `<article class="person-card ${warn?'alert':'ok'}"><div class="person-head"><div><div class="person-title">${safe(p.name)}</div><div class="person-meta">${user.id==='supervisor'?'Tugas pribadi • Pagi / Siang / Malam':'Tim Sales / CS • Berdasarkan shift'}</div></div>${warn?'<span class="badge red">⚠ Belum selesai</span>':'<span class="badge green">✓ Aman</span>'}</div><div class="person-nums">${p.pct}% <small>${p.done} dari ${p.total} penugasan</small></div>${progress(p.pct)}<div class="person-foot"><span>${p.pending} belum selesai ${p.overdue?`· ${p.overdue} terlambat`:''}</span><span>${p.total?'Status terpantau':'Belum ada tugas'}</span></div></article>`}
function overview(){const t=totals(),members=USERS.filter(u=>u.id!=='supervisor');let h=head('Overview Per Akun','Ringkasan monitoring Supervisor dan masing-masing akun anggota tim.','<button class="btn btn-primary" data-action="create">+ Buat Tugas</button>')+dateFilters();h+=`<div class="metrics">${metric('Total penugasan',t.total,'Pada rentang terpilih','gold')}${metric('Tugas selesai',t.done,'Checklist tercatat','green')}${metric('Belum selesai',t.pending,'Perlu perhatian','red')}${metric('Completion rate',t.pct+'%','Tingkat penyelesaian','')}</div>`;h+=`<div class="dash-section"><div class="header-sub">AKUN SUPERVISOR</div><div class="team-cards" style="grid-template-columns:1fr">${teamCard(SUP)}</div><div class="header-sub">MONITORING ANGGOTA TIM</div><div class="team-cards">${members.map(teamCard).join('')}</div></div>`;h+=`<section class="panel wide-panel"><h2>Status Per Akun</h2><p class="desc">Warning muncul bila ada penugasan yang belum selesai, di web dan rancangan extension V2.</p><div class="table-scroller"><table class="data-table"><thead><tr><th>Akun</th><th>Jadwal</th><th>Penugasan</th><th>Selesai</th><th>Belum selesai</th><th>Terlambat</th><th>Status</th></tr></thead><tbody>${USERS.map(u=>{let p=userStats(u.id);return `<tr><td class="taskname">${safe(u.name)}</td><td>${u.id==='supervisor'?'Pagi / Siang / Malam':'Shift 1 / Shift 2 / Split 1/3'}</td><td>${p.total}</td><td>${p.done}</td><td>${p.pending}</td><td>${p.overdue}</td><td>${p.pending?'<span class="badge red">⚠ Perlu tindak lanjut</span>':'<span class="badge green">✓ Selesai</span>'}</td></tr>`}).join('')}</tbody></table></div></section>`;return h}
function tasksPage(){const q=session.search.trim().toLowerCase();const items=data.tasks.filter(t=>(!q||t.title.toLowerCase().includes(q))&&(session.filterUser==='all'||t.assignees.includes(session.filterUser))&&(session.filterSession==='all'||t.session===session.filterSession)&&(t.repeat==='Harian'||daysInRange().includes(t.date)));let h=head('Manajemen Tugas','Kontrol jadwal pribadi Supervisor dan tugas shift tim secara terpisah.','<button class="btn btn-primary" data-action="create">+ Tambah Tugas</button>')+dateFilters();h+=`<div class="toolbar"><div class="filter search"><label>Cari tugas</label><input id="task-search" value="${safe(session.search)}" placeholder="Cari nama tugas..."></div><div class="filter"><label>Akun</label><select id="user-filter"><option value="all">Semua akun</option>${USERS.map(u=>`<option value="${u.id}" ${session.filterUser===u.id?'selected':''}>${safe(u.name)}</option>`).join('')}</select></div><div class="filter"><label>Sesi / Shift</label><select id="session-filter"><option value="all">Semua sesi</option>${[...SEG,...SHIFT].map(s=>`<option ${session.filterSession===s?'selected':''}>${s}</option>`).join('')}</select></div></div>`;h+=`<section class="panel"><div class="table-scroller"><table class="data-table"><thead><tr><th>Tugas</th><th>Ditugaskan ke</th><th>Sesi / Shift</th><th>Deadline</th><th>Periode</th><th>Progress*</th><th>Aksi</th></tr></thead><tbody>${items.map(t=>{let a=assignments().filter(x=>x.t.id===t.id);return `<tr><td><div class="taskname">${safe(t.title)}</div><div class="subcell">${safe(t.category)} ${t.title.startsWith('SIMULASI')?'· Contoh, bukan jobdesc final':''}</div></td><td>${t.assignees.map(id=>`<span class="badge">${safe(userName(id))}</span>`).join(' ')}</td><td><span class="pill-sm">${safe(t.session)}</span></td><td>${safe(t.deadline||'—')}</td><td>${t.repeat==='Harian'?'Harian':'Sekali · '+safe(dayLabel(t.date))}</td><td>${a.length?`${a.filter(x=>x.done).length}/${a.length}`:'—'}</td><td><button class="btn btn-sm" data-edit="${t.id}">Edit</button> <button class="btn btn-sm" data-delete="${t.id}">Hapus</button></td></tr>`}).join('')}</tbody></table></div>${items.length?'':'<div class="empty">Tidak ada tugas untuk filter ini.</div>'}</section><p class="tiny-note">*Progress berdasarkan tanggal terpilih. Rincian final distribusi tugas tim akan diinput setelah kamu kirim.</p>`;return h}
function teamPage(){let h=head('Akun Tim','Supervisor mengontrol semua tugas; anggota tim hanya mengerjakan checklist.')+dateFilters();h+=`<div class="team-cards">${USERS.filter(u=>u.id!=='supervisor').map(teamCard).join('')}</div><section class="panel"><h2>Hak akses dan shift</h2><p class="desc">Masing-masing tugas tim menggunakan pilihan Shift 1, Shift 2, atau Shift Split 1/3.</p><div class="table-scroller"><table class="data-table"><thead><tr><th>Akun</th><th>Role</th><th>Shift yang didukung</th><th>Ubah tugas</th><th>Checklist</th></tr></thead><tbody>${USERS.filter(u=>u.id!=='supervisor').map(u=>`<tr><td><b>${safe(u.name)}</b></td><td>${safe(u.role)}</td><td>${SHIFT.join(' / ')}</td><td><span class="badge">Hanya Supervisor</span></td><td><span class="badge green">✓ Ya</span></td></tr>`).join('')}</tbody></table></div></section><div class="info-strip">Belum ada distribusi tugas tim final. Contoh penugasan Shift 1, Shift 2, dan Split 1/3 hanya untuk menguji alur demo.</div>`;return h}
function reportPage(){const a=assignments(),t=totals();let h=head('Evaluasi & Riwayat','Lihat hasil checklist berdasarkan tanggal dan akun, lalu unduh CSV.','<button class="btn" data-action="export">↓ Export CSV</button>')+dateFilters();h+=`<div class="metrics">${metric('Penugasan',t.total,'Dalam rentang tanggal','gold')}${metric('Selesai',t.done,'Histori checklist','green')}${metric('Belum selesai',t.pending,'Butuh perhatian','red')}${metric('Terlambat',t.overdue,'Belum selesai melewati batas','red')}</div><section class="panel"><h2>Evaluasi Per Akun</h2><p class="desc">Persentase dihitung dari penugasan yang aktif pada tanggal terpilih.</p>${USERS.map(u=>{let p=userStats(u.id);return `<div class="person"><div class="line"><b>${safe(u.name)}</b><span>${p.done}/${p.total} · ${p.pct}% ${p.pending?'⚠':''}</span></div>${progress(p.pct)}</div>`}).join('')}</section><section class="panel wide-panel"><h2>Riwayat per tanggal</h2><p class="desc">Data simulasi lokal dari checklist yang kamu lakukan di demo ini.</p><div class="table-scroller"><table class="data-table"><thead><tr><th>Tanggal</th><th>Akun</th><th>Tugas</th><th>Shift/Sesi</th><th>Status</th><th>Jam selesai</th></tr></thead><tbody>${a.slice(0,140).map(x=>`<tr><td>${dayLabel(x.date)}</td><td>${safe(userName(x.userId))}</td><td>${safe(x.t.title)}</td><td>${safe(x.t.session)}</td><td>${badgeStatus(x)}</td><td>${x.time?new Date(x.time).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'—'}</td></tr>`).join('')}</tbody></table></div>${a.length?'':'<div class="empty">Tidak ada penugasan pada tanggal yang dipilih.</div>'}</section><div class="info-strip">Catatan: pada demo lokal, perubahan detail tugas berlaku juga pada laporan tanggal sebelumnya. Versi database final akan memakai snapshot penugasan per hari agar histori evaluasi tidak bergeser.</div>`;return h}
function staffTasks(){const user=session.userId,date=session.dateFrom||today;const list=data.tasks.filter(t=>t.assignees.includes(user)&&isForDate(t,date));const done=list.filter(t=>isDone(t,user,date));const visible=list.filter(t=>session.showCompleted?isDone(t,user,date):!isDone(t,user,date));const p=percent(done.length,list.length),groups=user==='supervisor'?SEG:SHIFT;let h=head('To Do List Saya',user==='supervisor'?'Tugas pribadi Supervisor dibagi Pagi, Siang, dan Malam.':'Tugas anggota mengikuti Shift 1, Shift 2, dan Shift Split 1/3.',`<span class="badge gold">${safe(userName(user))}</span>`);h+=`<div class="admin-datebar"><div class="filter"><label>Tanggal pekerjaan</label><input type="date" id="staff-date" value="${safe(date)}"></div><button class="btn btn-sm" data-action="today">Hari ini</button><span class="tiny-note">Pilih tanggal untuk melihat tugas dan progres hari tersebut.</span></div><div class="metrics">${metric('Total tugas',list.length,'Ditugaskan ke akun ini','gold')}${metric('Selesai',done.length,'Checklist tersimpan','green')}${metric('Belum selesai',list.length-done.length,'Perlu dikerjakan','red')}${metric('Progress',p+'%','Berdasarkan tanggal','')}</div>`;
if(list.some(t=>!isDone(t,user,date)))h+=`<div class="warning-strip">⚠ Masih ada ${list.length-done.length} tugas yang belum selesai ${date===today?'hari ini':'pada '+dayLabel(date)}. Peringatan ini juga direncanakan tampil di Chrome Extension V2.</div>`;
h+=`<div class="subnav"><button class="${!session.showCompleted?'active':''}" data-action="active">Tugas aktif (${list.length-done.length})</button><button class="${session.showCompleted?'active':''}" data-action="completed">Selesai (${done.length})</button></div><section class="panel"><h2>${session.showCompleted?'Tugas yang selesai':'Tugas yang perlu dikerjakan'}</h2><p class="desc">Anggota hanya bisa mengubah status checklist, bukan rincian tugas.</p>`;
for(const g of groups){const tasks=visible.filter(t=>t.session===g);if(!tasks.length)continue;h+=`<div class="session-label">${safe(g)}</div><div class="task-list">${tasks.map(t=>{const item={t,date,done:isDone(t,user,date)};return `<div class="task-item" data-task-row="${safe(t.id)}"><input type="checkbox" data-check="${safe(t.id)}" ${item.done?'checked':''} aria-label="Checklist ${safe(t.title)}"><div style="flex:1;min-width:0"><div class="taskname">${safe(t.title)}</div><div class="subcell">${safe(t.category)} · Deadline ${safe(t.deadline||'tidak diatur')} · ${safe(t.repeat)}</div></div>${badgeStatus(item)}</div>`}).join('')}</div>`}
if(!visible.length)h+='<div class="empty">✓ Tidak ada tugas di daftar ini.</div>';h+='</section><p class="rights-note">Hak edit tugas hanya milik Supervisor. Di sistem online, otorisasi akan diterapkan pada database.</p>';return h}
function modal(){const t=data.tasks.find(t=>t.id===session.editId),supervisor=t?isSupervisorTask(t):true,selected=t?.assignees||['supervisor'];return `<div class="modal-overlay"><form class="modal" id="task-form"><div class="modalhead"><div><div class="eyebrow">SUPERVISOR CONTROL</div><h2>${t?'Edit Tugas':'Buat Tugas Baru'}</h2></div><button type="button" class="btn btn-plain" data-action="close">✕</button></div><div class="formgrid"><div class="full"><label class="label">Nama tugas</label><input class="field" name="title" required maxlength="150" value="${safe(t?.title||'')}" placeholder="Nama tugas..."></div><div><label class="label">Jenis penugasan</label><select name="kind" class="field" id="task-kind"><option value="supervisor" ${supervisor?'selected':''}>Tugas pribadi Supervisor</option><option value="team" ${!supervisor?'selected':''}>Tugas anggota tim</option></select></div><div><label class="label">Sesi / Shift</label><select name="session" id="task-session" class="field"></select></div><div><label class="label">Deadline (opsional)</label><input name="deadline" type="time" class="field" value="${safe(t?.deadline||'')}"></div><div><label class="label">Kategori</label><select name="category" class="field">${['Monitoring & Controlling','KPI Monitoring'].map(v=>`<option ${v===t?.category?'selected':''}>${v}</option>`).join('')}</select></div><div><label class="label">Pengulangan</label><select name="repeat" id="task-repeat" class="field"><option ${t?.repeat!=='Sekali'?'selected':''}>Harian</option><option ${t?.repeat==='Sekali'?'selected':''}>Sekali</option></select></div><div><label class="label">Tanggal tugas sekali</label><input type="date" id="task-once-date" name="date" class="field" value="${safe(t?.date||session.dateFrom)}"></div><div class="full" id="team-box"><label class="label">Ditugaskan ke anggota tim (bisa lebih dari satu)</label><div class="checkgrid">${USERS.filter(u=>u.id!=='supervisor').map(u=>`<label><input name="assignees" type="checkbox" value="${u.id}" ${selected.includes(u.id)?'checked':''}>${safe(u.name)}</label>`).join('')}</div></div><div class="full"><label class="label">Catatan (opsional)</label><textarea name="notes" class="field" rows="2">${safe(t?.notes||'')}</textarea></div></div><div class="modal-foot"><button type="button" class="btn" data-action="close">Batal</button><button type="submit" class="btn btn-primary">Simpan Tugas</button></div></form></div>`}
function modalSync(){const form=document.querySelector('#task-form');if(!form)return;const t=data.tasks.find(t=>t.id===session.editId),kind=form.elements.kind.value,options=kind==='supervisor'?SEG:SHIFT,sel=t?.session;const node=form.elements.session;node.innerHTML=options.map(v=>`<option ${v===sel?'selected':''}>${v}</option>`).join('');document.querySelector('#team-box').style.display=kind==='supervisor'?'none':'block';form.elements.date.disabled=form.elements.repeat.value!=='Sekali'}
function draw(){if(!session.role)return login();const page=session.role==='admin'?({overview,tasks:tasksPage,team:teamPage,report:reportPage}[session.page]||overview)():staffTasks();app.innerHTML=`<div class="app-shell">${nav()}<main class="main">${page}<div class="footer-line">FENHAM | SALES TASK MANAGEMENT • DEMO V2.0 • PENYIMPANAN LOKAL</div></main></div>${session.modal?modal():''}`;if(session.modal)modalSync()}
function toast(msg){document.querySelector('.toast')?.remove();const div=document.createElement('div');div.className='toast';div.textContent=msg;document.body.appendChild(div);setTimeout(()=>div.remove(),2100)}
app.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){session.page=page.dataset.page;if(session.role==='staff')session.showCompleted=session.page==='history';session.modal=false;draw();return}if(e.target.closest('#logout')){session.role=null;session.userId=null;login();return}const edit=e.target.closest('[data-edit]');if(edit&&session.role==='admin'){session.editId=edit.dataset.edit;session.modal=true;draw();return}const del=e.target.closest('[data-delete]');if(del&&session.role==='admin'){const t=data.tasks.find(x=>x.id===del.dataset.delete);if(t&&confirm('Hapus tugas "'+t.title+'"?')){data.tasks=data.tasks.filter(x=>x.id!==t.id);data.history.push({action:'delete',taskId:t.id,title:t.title,timestamp:Date.now()});save();draw();toast('Tugas dihapus')}return}const action=e.target.closest('[data-action]');if(!action)return;const a=action.dataset.action;if(a==='create'&&session.role==='admin'){session.editId=null;session.modal=true;draw()}else if(a==='close'){session.modal=false;draw()}else if(a==='active'||a==='completed'){session.showCompleted=a==='completed';draw()}else if(a==='today'){session.dateFrom=today;session.dateTo=today;draw()}else if(a==='week'){let d=new Date();d.setDate(d.getDate()-6);session.dateFrom=dateKey(d);session.dateTo=today;draw()}else if(a==='export'&&session.role==='admin'){const rows=[['Tanggal','Akun','Tugas','Sesi/Shift','Deadline','Status','Jam Selesai'],...assignments().map(x=>[x.date,userName(x.userId),x.t.title,x.t.session,x.t.deadline||'',x.done?'Selesai':incompleteStatus(x)==='overdue'?'Terlambat':'Belum Selesai',x.time?new Date(x.time).toLocaleString('id-ID'):''])];const csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));let link=document.createElement('a');link.href=u;link.download='Fenham_Evaluasi_'+session.dateFrom+'_sd_'+session.dateTo+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(u),500)}});
app.addEventListener('change',e=>{const id=e.target.id;if(id==='range-from'||id==='range-to'){let start=document.querySelector('#range-from')?.value||today,end=document.querySelector('#range-to')?.value||today;if(start>end){toast('Tanggal mulai tidak boleh melebihi tanggal selesai');return}session.dateFrom=start;session.dateTo=end;draw();return}if(id==='staff-date'){session.dateFrom=e.target.value;session.dateTo=e.target.value;draw();return}if(id==='user-filter'){session.filterUser=e.target.value;draw();return}if(id==='session-filter'){session.filterSession=e.target.value;draw();return}if(id==='task-kind'){session.editId=session.editId;modalSync();return}if(id==='task-repeat'){document.querySelector('#task-once-date').disabled=e.target.value!=='Sekali';return}const c=e.target.closest('[data-check]');if(c&&session.role==='staff'){let t=data.tasks.find(x=>x.id===c.dataset.check),user=session.userId,date=session.dateFrom;if(!t||!t.assignees.includes(user))return;let k=completionKey(t,user,date);if(c.checked)data.completions[k]=Date.now();else delete data.completions[k];data.history.push({action:c.checked?'complete':'uncomplete',taskId:t.id,userId:user,date,title:t.title,timestamp:Date.now()});save();const row=c.closest('.task-item');if(row){row.classList.add('exiting');setTimeout(draw,250)}else draw()}});
app.addEventListener('input',e=>{if(e.target.id==='task-search'){session.search=e.target.value;const pos=e.target.selectionStart;draw();const el=document.getElementById('task-search');el?.focus();el?.setSelectionRange(pos,pos)}});
app.addEventListener('submit',e=>{if(e.target.id!=='task-form'||session.role!=='admin')return;e.preventDefault();const f=new FormData(e.target),title=String(f.get('title')||'').trim(),kind=f.get('kind'),assignees=kind==='supervisor'?['supervisor']:f.getAll('assignees');if(!title||!assignees.length){toast('Isi judul dan pilih minimal satu anggota');return}let exists=data.tasks.find(t=>t.id===session.editId),entry={id:exists?.id||uid(),title,session:f.get('session'),category:f.get('category'),deadline:f.get('deadline'),repeat:f.get('repeat'),date:f.get('repeat')==='Sekali'?f.get('date'):today,notes:f.get('notes'),assignees,createdAt:exists?.createdAt||Date.now()};if(exists)data.tasks=data.tasks.map(t=>t.id===entry.id?entry:t);else data.tasks.unshift(entry);data.history.push({action:exists?'edit':'create',taskId:entry.id,title,timestamp:Date.now()});save();session.modal=false;draw();toast(exists?'Tugas diperbarui':'Tugas berhasil dibuat')});
login();
})();
</script></body></html>
